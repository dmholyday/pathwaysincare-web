business_name: "Pathways in Care"
rating: 5
reviews:
  - text: "Kirsty was able to help us find a placement for both of my in-laws in a timely manner. Kirsty had a very pleasant nature and made the placement experience a more smooth process, taking away the stress at a difficult time for us. I would highly recommend Kirsty to help with the placement process."
    author: "Karen Griffiths"
    rating: 5
    date: "24 weeks ago"
    stars: "★★★★★"
  
  - text: "During an incredibly stressful time, Kirsty's knowledge & compassion supported us to find the right aged care for our family. We are very appreciative of her guidance & care for all family members. She made a difficult process much easier due to her extensive  knowledge of processes & the system. We highly recommend Pathways in Care, for all families dealing with these difficult & often heart breaking situations."
    author: "Rae Brown"
    rating: 5
    date: "31 weeks ago"
    stars: "★★★★★"
  
  - text: "Kirsty was amazing.\n\nFeel incredibly lucky to have been recommended her in the initial stages of sourcing aged care for both my parents. She was caring, considerate, thorough and knowledgeable.\n\nIn difficult circumstances she took care of everything and found a wonderful place for my parents in record time.\n\nCan highly recommend Pathways In Care."
    author: "Jane Kikeros"
    rating: 5
    date: "22 weeks ago"
    stars: "★★★★★"
  
  - text: "My neighbour has recently used Kirsty's help to find a nursing home placement for her husband. Kirsty was compassionate, understanding and very prompt in finding a placement.  She took away a lot of the stress involved by liasing with the hospital and nursing home for a very fast and smooth transition to the nursing home.  After the admission it was lovely to hear from Kirsty checking up that everything was OK. Thanks Kirsty"
    author: "Lisa F"
    rating: 5
    date: "23 weeks ago"
    stars: "★★★★★"

  - text: "Kirsty at Pathways In Care was amazing!! So understanding and helpful. She understood what we needed and kept us informed with each new development. Very very grateful for Kirsty's insider knowledge that narrowed down the options to an aged care facility that is perfect for our loved one. Many thanks Kirsty, you are a star!"
    author: "Ally Smart"
    rating: 5
    date: "10 weeks ago"
    stars: "★★★★★"

  - text: "Kirsty was extremely helpful in navigating the minefield of paperwork and bureaucracy involved with getting my Father and his wife into residential care together.  Kirsty is friendly and has a lovely personality and was always available to answer any questions or concerns  I highly recommend her services if you are presented with the same situation in your family.  Thankyou very much Kirsty, Sharon and Laurie"
    author: "Laurie Gibbs"
    rating: 5
    date: "13 weeks ago"
    stars: "★★★★★"

  - text: "Kirsty was caring, easy to talk to and very understanding of the burden we had to carry - all of a sudden find ourselves in a situation where we had to find a room in an aged care facility for our dad who had just been diagnosed with dementia. Trying to navigate the system ourselves was time consuming and very challenging. Having Kirsty take that part of the burden from us was truly wonderful. She has so much experience and knowledge of the system as well as wonderful contacts and she was able to find us a room in a much shorter timeframe than we had anticipated. We truly would have struggled without her help. She also helped us to do an application for SAT and I would highly recommend her professional, yet caring service."
    author: "Shamara Williams"
    rating: 5
    date: "14 weeks ago"
    stars: "★★★★★"

  - text: "Pathways to Care has been incredibly helpful with finding a placement for my dad in a care home, which included liaising with the hospital, social worker and other relevant medical staff and care home staff. It has been a very stressful few months and involving Kirsty was the best decision we made. Kirsty also helped us with paperwork related to a hearing with the State Tribunal. Again this was super helpful as I wouldn't have known where to begin! I highly recommend Kirsty/Pathways to Care, worth every dollar. Thanks so much Kirsty."
    author: "Rashitha Keenan"
    rating: 5
    date: "15 weeks ago"
    stars: "★★★★★"

  - text: "Kirsty was great in holding our hands through the process of finding a placement for our stepdad, Robert. Would highly recommend her services."
    author: "Fiona O'Donnell"
    rating: 5
    date: "16 weeks ago"
    stars: "★★★★★"